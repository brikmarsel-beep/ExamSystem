version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: examsystem_db
    environment:
      POSTGRES_USER: examsystem_user
      POSTGRES_PASSWORD: examsystem_pass
      POSTGRES_DB: examsystem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: